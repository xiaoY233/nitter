name: Docker

# On every push to master and on version tags: run the tests, build the image
# for both architectures, smoke test it, then publish it to the GitHub Container
# Registry as ghcr.io/<owner>/<repo>. Pull requests only build and test.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "skills/**"
  pull_request:
    paths:
      - "Dockerfile"
      - "compose.yml"
      - "nitter.nimble"
      - "src/**"
      - "public/**"
      - "tools/**"
      - ".github/workflows/build-docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # push to ghcr.io with the built-in token; no secret to configure
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # the test binaries link against libpcre at run time; compiling alone
      # does not need it, so it went missing here at first
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcre3 libsass-dev

      - name: Cache Nimble dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.nimble/pkgcache
            ~/.nimble/packages_official.json
          key: 2.2.x-nimble-v6-${{ hashFiles('*.nimble') }}
          restore-keys: |
            2.2.x-nimble-v6-

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 2.2.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: nimble build -Y

      - name: Unit tests
        run: |
          nim c -r --hints:off -o:/tmp/test_agent_api tests/test_agent_api.nim
          nim c -r --hints:off -o:/tmp/test_i18n tests/test_i18n.nim

      - name: Render the stylesheets and the about page
        run: |
          nim r --hint[Processing]:off tools/gencss
          nim r --hint[Processing]:off tools/rendermd

  build:
    name: Build image (${{ matrix.platform }})
    needs: [tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Image name in lower case
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a pull request the result is thrown away, only the exit status
      # matters. Otherwise each architecture is pushed by digest and the two
      # digests are combined into one manifest in the publish job.
      - name: Build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: false
          sbom: false

      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: false
          sbom: false

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: Smoke test (linux/amd64)
    needs: [build]
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Build for the local platform
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          cache-from: type=gha,scope=linux/amd64
          tags: nitter:ci
          provenance: false
          sbom: false

      # The server exits at startup without Redis (hence the service above) and
      # without a sessions file, so an empty one is mounted. The health endpoint
      # needs no X session and no API token, so it proves the binary starts,
      # reads its config and serves HTTP.
      - name: Start the container and wait for /.health
        run: |
          set -eux
          sed -i 's/redisHost = "localhost"/redisHost = "127.0.0.1"/' nitter.example.conf
          : > sessions.jsonl
          docker run -d --name nitter-ci --network host \
            -v "$PWD/nitter.example.conf:/src/nitter.conf:ro" \
            -v "$PWD/sessions.jsonl:/src/sessions.jsonl:ro" \
            nitter:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/.health; then
              echo
              docker logs nitter-ci | tail -5
              exit 0
            fi
            sleep 2
          done
          echo "the container did not answer within 60s" >&2
          docker logs nitter-ci >&2 || true
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker logs nitter-ci || true

      - name: Stop the container
        if: always()
        run: |
          docker stop nitter-ci || true
          docker rm nitter-ci || true

  # Combines the per-architecture digests into one manifest, so that
  # `docker pull ghcr.io/<owner>/<repo>:latest` serves the right image on any
  # CPU. Only runs once the smoke test passed.
  publish:
    name: Publish to ghcr.io
    needs: [build, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Image name in lower case
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest on the default branch, the version on a v* tag, and always the
      # commit, so a specific build can be pulled back
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create the manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -eux
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect the published image
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
