name: Docker

# On every push to master: run the unit tests, then build the image on both
# architectures to prove the Dockerfile still works. Nothing is pushed to a
# registry; publishing is done outside this repository.
on:
  push:
    branches:
      - master
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "skills/**"
  pull_request:
    paths:
      - "Dockerfile"
      - "compose.yml"
      - "nitter.nimble"
      - "src/**"
      - "public/**"
      - "tools/**"
      - ".github/workflows/build-docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: nitter

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Cache Nimble dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.nimble/pkgcache
            ~/.nimble/packages_official.json
          key: 2.2.x-nimble-v6-${{ hashFiles('*.nimble') }}
          restore-keys: |
            2.2.x-nimble-v6-

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 2.2.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: nimble build -Y

      - name: Unit tests
        run: |
          nim c -r --hints:off -o:/tmp/test_agent_api tests/test_agent_api.nim
          nim c -r --hints:off -o:/tmp/test_i18n tests/test_i18n.nim

      - name: Render the stylesheets and the about page
        run: |
          nim r --hint[Processing]:off tools/gencss
          nim r --hint[Processing]:off tools/rendermd

  build:
    name: Build image (${{ matrix.platform }})
    needs: [tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      # no `push`, no `load`: the result stays in the build cache and only the
      # exit status matters
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: false
          sbom: false

  smoke:
    name: Smoke test (linux/amd64)
    needs: [build]
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Build for the local platform
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          cache-from: type=gha,scope=linux/amd64
          tags: ${{ env.IMAGE }}:ci
          provenance: false
          sbom: false

      # The server exits at startup without Redis (hence the service above) and
      # without a sessions file, so an empty one is mounted. The health endpoint
      # needs no X session and no API token, so it proves the binary starts,
      # reads its config and serves HTTP.
      - name: Start the container and wait for /.health
        run: |
          set -eux
          sed -i 's/redisHost = "localhost"/redisHost = "127.0.0.1"/' nitter.example.conf
          : > sessions.jsonl
          docker run -d --name nitter-ci --network host \
            -v "$PWD/nitter.example.conf:/src/nitter.conf:ro" \
            -v "$PWD/sessions.jsonl:/src/sessions.jsonl:ro" \
            "${{ env.IMAGE }}:ci"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/.health; then
              echo
              docker logs nitter-ci | tail -5
              exit 0
            fi
            sleep 2
          done
          echo "the container did not answer within 60s" >&2
          docker logs nitter-ci >&2 || true
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker logs nitter-ci || true

      - name: Stop the container
        if: always()
        run: |
          docker stop nitter-ci || true
          docker rm nitter-ci || true
