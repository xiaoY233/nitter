name: Tests

on:
  # every branch including master, plus pull requests. Pushes to master do not
  # build or publish an image; that only happens for v* tags (build-docker.yml),
  # which run the tests themselves.
  push:
    paths-ignore:
      - "*.md"
    branches:
      - "**"
  pull_request:
    paths-ignore:
      - "*.md"
  workflow_call:

# Ensure that multiple runs on the same branch do not overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# The browser tests in tests/ (seleniumbase against real X pages) are not run
# here: they need a live X session in the SESSIONS secret. Run them locally with
# `cd tests && poetry run pytest` after starting the server.

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        nim: ["2.0.x", "2.2.x"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # the test binaries link against libpcre at run time
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcre3 libsass-dev

      - name: Cache Nimble Dependencies
        id: cache-nimble
        uses: actions/cache@v5
        with:
          path: |
            ~/.nimble/pkgcache
            ~/.nimble/packages_official.json
          key: ${{ matrix.nim }}-nimble-v6-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ matrix.nim }}-nimble-v6-

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Project
        run: nimble build -Y

      - name: Unit tests
        run: |
          nim c -r --hints:off -o:/tmp/test_agent_api tests/test_agent_api.nim
          nim c -r --hints:off -o:/tmp/test_i18n tests/test_i18n.nim

      - name: Render CSS and Markdown
        run: |
          nim r --hint[Processing]:off tools/gencss
          nim r --hint[Processing]:off tools/rendermd

      - name: Upload 2.2.x build artifact
        if: matrix.nim == '2.2.x'
        uses: actions/upload-artifact@v6
        with:
          name: nitter-linux-nim-2.2.x-${{ github.sha }}
          path: |
            ./nitter
          if-no-files-found: error
